name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # to attach the built files to the release
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      # a wheel on the release page saves anyone who'd rather not install
      # from a git url; pipx and uv tool both take a wheel path directly
      - name: attach the wheel and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
