name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # windows has its own curses story (windows-curses, and the
          # import fallback when it is missing), macos its own terminal
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
    runs-on: ${{ matrix.os }}
    # a test that blocks should fail the job, not sit there for six hours
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      # -v names the test in the log, so a hang says which one
      - run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uvx ruff check .

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
      - name: install the built wheel the way a user would
        shell: bash
        run: |
          pipx install ./dist/chartarr-*.whl
          chartarr --version
          chartarr --example
          test -f sample.csv
      - name: windows-curses came with it
        if: runner.os == 'Windows'
        shell: bash
        run: pipx runpip chartarr show windows-curses
